
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>4Eyed Records Scanner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f4f6f7;
      color: #193348;
    }
    button {
      background: #177e78;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 16px 25px;
      font-size: 18px;
    }
    video {
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>4Eyed Records</h1>
  <p>Inventory Scanner — Camera Test</p>

  <button onclick="startCamera()">Test Camera</button>
  <p id="status">Camera not started</p>
  <video id="preview" autoplay playsinline muted></video>

  <script>
    async function startCamera() {
      const status = document.getElementById('status');
      const video = document.getElementById('preview');

      try {
        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
          });

        video.srcObject = stream;
        await video.play();
        status.textContent = 'Camera working!';
      } catch (error) {
        status.textContent =
          'Camera error: ' + error.name +
          ' — ' + error.message;
      }
    }
  </script>
</body>
</html>
