
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>4Eyed Records Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f4f6f7;
      color: #193348;
    }
    button {
      background: #177e78;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 16px 25px;
      font-size: 18px;
    }
    video {
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
      border-radius: 10px;
    }
  </style>
</head>


<body>
  <h1>4Eyed Records</h1>
  <p>Inventory Scanner — UPC Test</p>

  <button id="startBtn" onclick="startScanner()">
    Scan Barcode
  </button>

  <button id="stopBtn" onclick="stopScanner()"
          style="display:none">
    Stop Scanner
  </button>

  <p id="status">Ready to scan</p>
  <div id="reader" style="width:100%; max-width:500px; margin:auto;"></div>

  <h3>Scanned UPC</h3>
  <p id="upc">No barcode scanned yet</p>
  <h3>Album Identification</h3>
<div id="albumResults">
  Scan a record barcode to search MusicBrainz.
</div>

  <script>
    let scanner = null;
    let busy = false;

    async function startScanner() {
      const status = document.getElementById('status');

      if (typeof Html5Qrcode === 'undefined') {
        status.textContent = 'Scanner library failed to load.';
        return;
      }

      try {
        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: { width: 250, height: 150 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E,
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8
            ]
          },
          async (decodedText) => {
            if (busy) return;
            busy = true;

            let code = decodedText;

            if (code.length === 13 && code.startsWith('0')) {
              code = code.substring(1);
            }

            document.getElementById('upc').textContent = code;
            status.textContent = 'Barcode scanned successfully!';
            lookupAlbum(code);

            await stopScanner();
            busy = false;
          },
          () => {}
        );

        document.getElementById('stopBtn').style.display = 'inline-block';
        document.getElementById('startBtn').style.display = 'none';
        status.textContent = 'Point camera at UPC barcode';

      } catch (error) {
        status.textContent =
          'Scanner error: ' + (error.message || String(error));
      }
    }

    async function stopScanner() {
      if (scanner) {
        try {
          if (scanner.isScanning) {
            await scanner.stop();
          }
          scanner.clear();
        } catch (error) {
          console.log(error);
        }
        scanner = null;
      }

      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('startBtn').style.display = 'inline-block';
    }
    
async function lookupAlbum(upc) {
  const results = document.getElementById('albumResults');

  results.textContent = 'Searching MusicBrainz...';

  try {
    const query = 'barcode:' + upc;

    const url =
      'https://musicbrainz.org/ws/2/release/?query=' +
      encodeURIComponent(query) +
      '&fmt=json&limit=5';

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error('MusicBrainz returned ' + response.status);
    }

    const data = await response.json();
    const releases = data.releases || [];

    results.replaceChildren();

    if (!releases.length) {
      results.textContent =
        'No UPC match found. Manual album search will be added next.';
      return;
    }

    releases.forEach(release => {
      const artist = (release['artist-credit'] || [])
        .map(a => a.name || '')
        .filter(Boolean)
        .join(', ');

      const item = document.createElement('div');
      item.style.padding = '12px';
      item.style.marginBottom = '10px';
      item.style.background = '#ffffff';
      item.style.borderRadius = '8px';

      const title = document.createElement('strong');
      title.textContent = release.title || 'Unknown album';

      const details = document.createElement('p');
      details.textContent =
        'Artist: ' + (artist || 'Unknown') +
        ' | Year: ' + (release.date || 'Unknown') +
        ' | Country: ' + (release.country || 'Unknown');

      item.append(title, details);
      results.appendChild(item);
    });

  } catch (error) {
    results.textContent =
      'Lookup failed: ' + (error.message || String(error));
  }
}

  </script>
</body>


</html>
